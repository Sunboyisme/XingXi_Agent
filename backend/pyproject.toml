[project]
name = "bai-agent-backend"
version = "0.1.7"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "langchain[mcp]==1.4.3",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "apscheduler>=3.11,<4",
  "keyring>=25,<26",
  "python-multipart>=0.0.20",
  "pillow>=11,<13",
  "qrcode[pil]>=8,<9",
  "pyyaml>=6,<7",
  "python-docx>=1.2.0",
  "pypdf>=6.21.1",
  "reportlab>=5.0.1",
  "openpyxl>=3.1.5",
  "xlsxwriter>=3.2.9",
  "defusedxml>=0.7.1",
  "pymupdf>=1.26,<1.27",
]

[dependency-groups]
dev = [
    "pyinstaller>=6,<7",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
